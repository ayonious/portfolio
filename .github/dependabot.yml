# Dependabot opens weekly update PRs. It has no auto-merge setting of its own:
# .github/workflows/dependabot-weekly-merge.yml merges the PRs whose
# checks all pass every Monday, including major version updates.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      development-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
